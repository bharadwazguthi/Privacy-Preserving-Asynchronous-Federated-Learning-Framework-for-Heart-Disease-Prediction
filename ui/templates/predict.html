<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AFLCP – Prediction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-800">

  <!-- ================= NAVBAR ================= -->
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

      <div class="flex items-center gap-2">
        <span class="material-icons text-blue-600 text-3xl">flag</span>
        <span class="text-xl font-bold">AFLCP</span>
      </div>

      <nav class="hidden md:flex gap-8 text-gray-600 font-medium">
        <a href="/" class="hover:text-blue-600">Home</a>
        <a href="/dashboard" class="hover:text-blue-600">Dashboard</a>
        <a href="/predict" class="text-blue-600">Predict</a>
      </nav>

      <div class="flex items-center gap-4">
        <span class="material-icons text-gray-500">search</span>
        <img src="https://i.pravatar.cc/40" class="rounded-full w-9 h-9" />
      </div>

    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main class="max-w-5xl mx-auto px-6 py-10">

    <div class="bg-white rounded-xl shadow p-8">

      <h1 class="text-2xl font-bold mb-2">Cardiovascular Health Assessment</h1>
      <p class="text-gray-600 mb-8">
        Enter your health parameters below to predict the probability of heart disease.
      </p>

      <!-- ================= FORM ================= -->
      <form id="predictionForm" class="grid md:grid-cols-2 gap-6">

        <!-- Age -->
        <div>
          <label class="block text-sm font-medium mb-1">Age</label>
          <input type="number" name="age" id="age" placeholder="e.g., 52" class="w-full border rounded-lg px-4 py-2"
            required>
        </div>

        <!-- Sex -->
        <div>
          <label class="block text-sm font-medium mb-1">Sex</label>
          <select name="sex" id="sex" class="w-full border rounded-lg px-4 py-2" required>
            <option value="">Select Sex</option>
            <option value="1">Male</option>
            <option value="0">Female</option>
          </select>
        </div>

        <!-- Chest Pain Type -->
        <div>
          <label class="block text-sm font-medium mb-1">Chest Pain Type</label>
          <select name="cp" id="cp" class="w-full border rounded-lg px-4 py-2" required>
            <option value="">Select Type</option>
            <option value="0">Typical Angina</option>
            <option value="1">Atypical Angina</option>
            <option value="2">Non-anginal Pain</option>
            <option value="3">Asymptomatic</option>
          </select>
        </div>

        <!-- Resting Blood Pressure -->
        <div>
          <label class="block text-sm font-medium mb-1">Resting Blood Pressure (mm Hg)</label>
          <input type="number" name="trestbps" id="trestbps" placeholder="e.g., 120"
            class="w-full border rounded-lg px-4 py-2" required>
        </div>

        <!-- Serum Cholesterol -->
        <div>
          <label class="block text-sm font-medium mb-1">Serum Cholesterol (mg/dl)</label>
          <input type="number" name="chol" id="chol" placeholder="e.g., 211" class="w-full border rounded-lg px-4 py-2"
            required>
        </div>

        <!-- Fasting Blood Sugar -->
        <div>
          <label class="block text-sm font-medium mb-1">Fasting Blood Sugar &gt; 120 mg/dl</label>
          <select name="fbs" id="fbs" class="w-full border rounded-lg px-4 py-2" required>
            <option value="">Select Option</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
          </select>
        </div>

        <!-- Resting ECG Results -->
        <div>
          <label class="block text-sm font-medium mb-1">Resting ECG Results</label>
          <select name="restecg" id="restecg" class="w-full border rounded-lg px-4 py-2" required>
            <option value="">Select Result</option>
            <option value="0">Normal</option>
            <option value="1">ST-T Abnormality</option>
            <option value="2">Left Ventricular Hypertrophy</option>
          </select>
        </div>

        <!-- Maximum Heart Rate -->
        <div>
          <label class="block text-sm font-medium mb-1">Maximum Heart Rate Achieved</label>
          <input type="number" name="thalach" id="thalach" placeholder="e.g., 142"
            class="w-full border rounded-lg px-4 py-2" required>
        </div>

        <!-- Exercise Induced Angina -->
        <div>
          <label class="block text-sm font-medium mb-1">Exercise Induced Angina</label>
          <select name="exang" id="exang" class="w-full border rounded-lg px-4 py-2" required>
            <option value="">Select Option</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
          </select>
        </div>

        <!-- ST Depression -->
        <div>
          <label class="block text-sm font-medium mb-1">ST Depression Induced by Exercise</label>
          <input type="number" step="0.1" name="oldpeak" id="oldpeak" placeholder="e.g., 1.5"
            class="w-full border rounded-lg px-4 py-2" required>
        </div>

        <!-- Slope -->
        <div>
          <label class="block text-sm font-medium mb-1">Slope of the Peak Exercise ST Segment</label>
          <select name="slope" id="slope" class="w-full border rounded-lg px-4 py-2" required>
            <option value="">Select Slope</option>
            <option value="0">Upsloping</option>
            <option value="1">Flat</option>
            <option value="2">Downsloping</option>
          </select>
        </div>

        <!-- Major Vessels -->
        <div>
          <label class="block text-sm font-medium mb-1">Major Vessels Colored by Fluoroscopy</label>
          <select name="ca" id="ca" class="w-full border rounded-lg px-4 py-2" required>
            <option value="">Select Number</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>

        <!-- Thalassemia -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium mb-1">Thalassemia</label>
          <select name="thal" id="thal" class="w-full border rounded-lg px-4 py-2" required>
            <option value="">Select Type</option>
            <option value="1">Normal</option>
            <option value="2">Fixed Defect</option>
            <option value="3">Reversible Defect</option>
          </select>
        </div>

      </form>

      <!-- ================= ACTIONS ================= -->
      <div class="flex justify-end gap-4 mt-8">
        <button type="button" id="resetBtn" class="px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
          Reset
        </button>
        <button type="button" id="predictBtn" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
          Predict
        </button>
      </div>

      <!-- ================= RESULT ================= -->
      <div id="resultSection" class="mt-10 border-t pt-6 hidden">
        <h2 class="font-semibold mb-2">Prediction Result</h2>
        <p class="text-gray-600">Probability of Heart Disease:</p>

        <div class="flex justify-between items-center mt-2">
          <span id="probability" class="text-xl font-bold">--%</span>
          <span id="riskLabel" class="px-4 py-1 rounded-full text-sm">
            Calculating...
          </span>
        </div>
      </div>

      <!-- ================= ERROR MESSAGE ================= -->
      <div id="errorSection" class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg hidden">
        <p id="errorMessage" class="text-red-600 text-sm"></p>
      </div>

    </div>

  </main>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    const form = document.getElementById("predictionForm");
    const predictBtn = document.getElementById("predictBtn");
    const resetBtn = document.getElementById("resetBtn");
    const resultSection = document.getElementById("resultSection");
    const probability = document.getElementById("probability");
    const riskLabel = document.getElementById("riskLabel");
    const errorSection = document.getElementById("errorSection");
    const errorMessage = document.getElementById("errorMessage");

    // Field names that match the model's expected features
    const fields = ["age", "sex", "cp", "trestbps", "chol", "fbs", "restecg", "thalach", "exang", "oldpeak", "slope", "ca", "thal"];

    resetBtn.onclick = () => {
      form.reset();
      resultSection.classList.add("hidden");
      errorSection.classList.add("hidden");
    };

    predictBtn.onclick = async () => {
      // Hide previous results/errors
      resultSection.classList.add("hidden");
      errorSection.classList.add("hidden");

      // Validate form
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      // Collect form data
      const data = {};
      fields.forEach(field => {
        const el = document.getElementById(field);
        const value = el.value;
        // Convert to number
        data[field] = parseFloat(value);
      });

      try {
        predictBtn.disabled = true;
        predictBtn.innerText = "Predicting...";

        const res = await fetch("/api/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.detail || "Prediction failed");
        }

        // Display result
        resultSection.classList.remove("hidden");

        const prob = result.probability_of_disease !== undefined
          ? (result.probability_of_disease * 100).toFixed(1)
          : (result.confidence * 100).toFixed(1);

        probability.innerText = prob + "%";

        // Update risk label
        const probValue = parseFloat(prob);
        if (probValue >= 50) {
          riskLabel.className = "bg-red-100 text-red-600 px-4 py-1 rounded-full text-sm";
          riskLabel.innerText = "High Risk of Heart Disease";
        } else if (probValue >= 30) {
          riskLabel.className = "bg-yellow-100 text-yellow-600 px-4 py-1 rounded-full text-sm";
          riskLabel.innerText = "Moderate Risk";
        } else {
          riskLabel.className = "bg-green-100 text-green-600 px-4 py-1 rounded-full text-sm";
          riskLabel.innerText = "Low Risk";
        }

      } catch (err) {
        errorSection.classList.remove("hidden");
        errorMessage.innerText = err.message || "An error occurred. Make sure the model is trained first.";
      } finally {
        predictBtn.disabled = false;
        predictBtn.innerText = "Predict";
      }
    };
  </script>

  <!-- ================= FOOTER ================= -->
  <footer class="mt-16 py-6 text-center text-gray-500 text-sm">
    © 2024 AFLCP Project. All Rights Reserved.
  </footer>

</body>

</html>
