<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>AFLCP – Login</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a1628 0%, #0d2137 25%, #0f2d4a 50%, #0a1e36 75%, #061220 100%);
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(17, 147, 212, 0.12) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
      pointer-events: none;
    }
    .particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
    .particle {
      position: absolute; width: 4px; height: 4px; background: rgba(17, 147, 212, 0.4);
      border-radius: 50%; animation: floatUp 8s linear infinite;
    }
    .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 10s; }
    .particle:nth-child(2) { left: 25%; animation-delay: 2s; animation-duration: 12s; }
    .particle:nth-child(3) { left: 40%; animation-delay: 4s; animation-duration: 8s; }
    .particle:nth-child(4) { left: 55%; animation-delay: 1s; animation-duration: 14s; }
    .particle:nth-child(5) { left: 70%; animation-delay: 3s; animation-duration: 9s; }
    .particle:nth-child(6) { left: 85%; animation-delay: 5s; animation-duration: 11s; }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
    }
    .login-container {
      position: relative; z-index: 10; width: 100%; max-width: 460px; padding: 0 20px;
    }
    .logo-section { text-align: center; margin-bottom: 32px; }
    .logo-icon {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, #1193d4, #6366f1);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 16px; box-shadow: 0 8px 32px rgba(17, 147, 212, 0.3);
      animation: pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 8px 32px rgba(17, 147, 212, 0.3); }
      50% { box-shadow: 0 8px 48px rgba(17, 147, 212, 0.5); }
    }
    .logo-icon .material-symbols-outlined { font-size: 36px; color: white; }
    .logo-title { font-size: 28px; font-weight: 800; color: #e0e6e9; letter-spacing: -0.5px; }
    .logo-subtitle { font-size: 14px; color: #94aab5; margin-top: 4px; }
    .card {
      background: rgba(24, 38, 46, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px;
      padding: 40px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
    }
    .tabs { display: flex; margin-bottom: 32px; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 4px; }
    .tab {
      flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 600;
      color: #94aab5; border-radius: 10px; cursor: pointer; transition: all 0.3s;
      border: none; background: none;
    }
    .tab.active { background: #1193d4; color: white; box-shadow: 0 4px 12px rgba(17, 147, 212, 0.3); }
    .tab:not(.active):hover { color: #e0e6e9; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: #94aab5; margin-bottom: 8px; }
    .form-input {
      width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
      color: #e0e6e9; font-size: 15px; font-family: 'Inter', sans-serif;
      transition: all 0.3s; outline: none;
    }
    .form-input:focus { border-color: #1193d4; box-shadow: 0 0 0 3px rgba(17, 147, 212, 0.15); }
    .form-input::placeholder { color: #617c89; }
    .btn-primary {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #1193d4, #0d7ab5);
      color: white; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(17, 147, 212, 0.3);
      font-family: 'Inter', sans-serif;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(17, 147, 212, 0.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-msg {
      background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171; padding: 12px 16px; border-radius: 10px; font-size: 13px;
      margin-bottom: 20px; display: none; align-items: center; gap: 8px;
    }
    .success-msg {
      background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399; padding: 12px 16px; border-radius: 10px; font-size: 13px;
      margin-bottom: 20px; display: none; align-items: center; gap: 8px;
    }
    .default-creds {
      text-align: center; margin-top: 24px; padding: 16px; border-radius: 12px;
      background: rgba(99, 102, 241, 0.08); border: 1px solid rgba(99, 102, 241, 0.15);
    }
    .default-creds p { color: #94aab5; font-size: 12px; line-height: 1.6; }
    .default-creds strong { color: #c4b5fd; }
    .copyright { text-align: center; margin-top: 24px; color: #617c89; font-size: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>

  <div class="login-container">
    <div class="logo-section">
      <div class="logo-icon">
        <span class="material-symbols-outlined">cardiology</span>
      </div>
      <h1 class="logo-title">AFLCP Platform</h1>
      <p class="logo-subtitle">Privacy-Preserving Federated Learning for Heart Disease Prediction</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" id="loginTab" onclick="switchTab('login')">Sign In</button>
        <button class="tab" id="registerTab" onclick="switchTab('register')">Create Account</button>
      </div>

      <div id="errorMsg" class="error-msg">
        <span class="material-symbols-outlined" style="font-size:18px">error</span>
        <span id="errorText"></span>
      </div>
      <div id="successMsg" class="success-msg">
        <span class="material-symbols-outlined" style="font-size:18px">check_circle</span>
        <span id="successText"></span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="form-input" id="loginUsername" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">
          <span class="material-symbols-outlined" style="font-size:20px">login</span>
          Sign In
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)" style="display:none">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="regFullName" placeholder="Dr. John Smith" required>
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="form-input" id="regUsername" placeholder="Choose a username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="regPassword" placeholder="Min 4 characters" required minlength="4" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" id="registerBtn">
          <span class="material-symbols-outlined" style="font-size:20px">person_add</span>
          Create Account
        </button>
      </form>

      <div class="default-creds">
        <p>
          <strong>Default Accounts:</strong><br>
          admin / admin123 &nbsp;•&nbsp; doctor / doctor123
        </p>
      </div>
    </div>

    <p class="copyright">© 2025 AFLCP Project • Federated Learning for Healthcare</p>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';
      if (tab === 'login') {
        document.getElementById('loginTab').classList.add('active');
        document.getElementById('registerTab').classList.remove('active');
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
      } else {
        document.getElementById('registerTab').classList.add('active');
        document.getElementById('loginTab').classList.remove('active');
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('loginForm').style.display = 'none';
      }
    }

    function showError(msg) {
      document.getElementById('errorText').innerText = msg;
      document.getElementById('errorMsg').style.display = 'flex';
      document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
      document.getElementById('successText').innerText = msg;
      document.getElementById('successMsg').style.display = 'flex';
      document.getElementById('errorMsg').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined spinner" style="font-size:20px">progress_activity</span> Signing in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginUsername').value,
            password: document.getElementById('loginPassword').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');
        showSuccess('Login successful! Redirecting...');
        setTimeout(() => window.location.href = '/home', 500);
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:20px">login</span> Sign In';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined spinner" style="font-size:20px">progress_activity</span> Creating...';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: document.getElementById('regFullName').value,
            username: document.getElementById('regUsername').value,
            password: document.getElementById('regPassword').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');
        showSuccess('Account created! Redirecting...');
        setTimeout(() => window.location.href = '/home', 500);
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:20px">person_add</span> Create Account';
      }
    }
  </script>
</body>
</html>
